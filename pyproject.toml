[project]
name = "rag-ingestion-pipeline"
version = "1.0.0"
description = "Incremental document ingestion for RAG: chunking, embedding cache, hybrid search, retrieval evaluation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
