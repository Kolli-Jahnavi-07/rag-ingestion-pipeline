name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make lint
      - run: make test
      - name: Retrieval quality gate (fails the build if recall@5 drops below 97%)
        run: make eval
      - name: Demo
        run: make demo
